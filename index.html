<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
const video = document.getElementById('video');

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
});

let lastAlertTime = 0;

async function loadModel() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(
    "https://cdn.jsdelivr.net/npm/face-api.js/models"
  );
}

async function start() {
  await loadModel();

  setInterval(async () => {
    const result = await faceapi.detectAllFaces(
      video,
      new faceapi.TinyFaceDetectorOptions()
    );

    // ❗ Face not detected = suspicious
    if (result.length === 0) {
      const now = Date.now();

      // Spam रोकने के लिए (10 sec gap)
      if (now - lastAlertTime > 10000) {
        sendAlert();
        lastAlertTime = now;
      }
    }
  }, 3000);
}

function sendAlert() {
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  const image = canvas.toDataURL();

  navigator.geolocation.getCurrentPosition(pos => {
    
    fetch("https://ai-alert-system-5v1v.onrender.com", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: image,
        location: pos.coords.latitude + "," + pos.coords.longitude
      })
    });

    console.log("🚨 Suspicious Activity Detected");
  });
}

start();
</script>
