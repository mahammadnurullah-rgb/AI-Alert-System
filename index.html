<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: black;
}

video {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}
button {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px;
  background: red;
  color: white;
  border: none;
}
</style>
</head>

<body>

<video id="video" autoplay></video>
<button onclick="send()">🚨 Send Alert</button>

<script>
const video = document.getElementById('video');

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
});

function send() {
  navigator.geolocation.getCurrentPosition(pos => {
    alert("📍 Location: " + pos.coords.latitude + "," + pos.coords.longitude);
  });
}
</script>

</body>
</html>
